<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japon, mars 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23d8432f'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Carnet de voyage projeté : encre sombre, vermillon torii, papier washi */
:root{
  --ink:#121110; --ink2:#1b1a18; --paper:#f1ece1; --paper-dim:#b9b2a2;
  --verm:#d8432f; --gold:#c9a86a; --line:#35322c;
  --font-head:'Shippori Mincho',serif; --font-body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:16px}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px}
#gate form{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:340px;text-align:center}
#gate .kanji{font-family:var(--font-head);color:var(--verm);font-size:3rem;line-height:1}
#gate h1{font-family:var(--font-head);font-size:1.6rem;margin:0;font-weight:500}
#gate p{color:var(--paper-dim);margin:0;font-size:.9rem}
#gate input{background:var(--ink2);border:1px solid var(--line);color:var(--paper);padding:11px 14px;border-radius:8px;font-size:1rem;width:220px;text-align:center}
#gate button{background:var(--verm);color:#fff;border:none;padding:11px 26px;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;font-family:var(--font-body)}
#gate .err{color:var(--verm);font-size:.85rem;min-height:1.1em;margin:0}

/* ---------- deck ---------- */
#deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .45s ease;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.slide.active{opacity:1;visibility:visible}

/* cover */
.s-cover{gap:18px;text-align:center}
.s-cover .kanji{font-family:var(--font-head);color:var(--verm);font-size:clamp(3rem,9vw,5.5rem);line-height:1.1}
.s-cover h1{font-family:var(--font-head);font-weight:700;font-size:clamp(2.2rem,7vw,4.5rem);margin:0;letter-spacing:.04em}
.s-cover .dates{color:var(--gold);letter-spacing:.25em;text-transform:uppercase;font-size:clamp(.8rem,2vw,1rem)}
.s-cover .hint{color:var(--paper-dim);font-size:.85rem;margin-top:26px}

/* text slides (intro, fin) */
.s-text{max-width:720px;margin:0 auto;gap:14px;text-align:center}
.s-text h2{font-family:var(--font-head);font-size:clamp(1.6rem,4.5vw,2.6rem);margin:0;font-weight:500}
.s-text p{color:var(--paper-dim);line-height:1.75;margin:0;font-size:clamp(.95rem,2.2vw,1.1rem)}
.s-text .stats{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.s-text .stat b{display:block;font-family:var(--font-head);font-size:clamp(1.8rem,5vw,2.6rem);color:var(--gold);font-variant-numeric:tabular-nums}
.s-text .stat span{color:var(--paper-dim);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}

/* carte */
.s-map .frame{width:min(1200px,94vw);height:min(72vh,700px);background:var(--ink2);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.s-map iframe{width:100%;height:100%;border:none}
.s-map h2{font-family:var(--font-head);font-size:clamp(1.4rem,4vw,2.2rem);margin:0 0 14px;font-weight:500}
.s-map .lien{margin-top:12px;font-size:.85rem}
.s-map a{color:var(--gold)}

/* ---------- page journée : récit + mosaïque ---------- */
.s-jour{flex-direction:row;align-items:stretch;justify-content:stretch;gap:0;padding-top:14px;padding-bottom:58px}
.s-jour .recit{flex:0 0 380px;max-width:42%;padding:28px 28px 28px 6px;display:flex;flex-direction:column;min-height:0}
.s-jour .rtext{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;padding-right:6px}
.s-jour .recit .jour{color:var(--verm);letter-spacing:.3em;text-transform:uppercase;font-size:.72rem;font-variant-numeric:tabular-nums}
.s-jour .recit h2{font-family:var(--font-head);font-size:clamp(1.25rem,2.1vw,1.7rem);margin:0;font-weight:700;text-wrap:balance}
.s-jour .recit .resume{color:var(--paper-dim);line-height:1.65;font-size:.86rem;margin:0}
.s-jour .recit .hl{display:flex;gap:7px;flex-wrap:wrap}
.s-jour .recit .hl span{border:1px solid var(--line);color:var(--gold);padding:3px 10px;border-radius:999px;font-size:.68rem}
.s-jour .recit .astuce{color:var(--paper-dim);font-size:.68rem;letter-spacing:.08em;margin-top:auto;padding-top:10px}
.s-jour .mur{flex:1;overflow-y:auto;padding:8px 4px 8px 0;scrollbar-width:thin}
.s-jour .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:120px;grid-auto-flow:dense;gap:8px}
.s-jour .tuile{position:relative;border-radius:8px;overflow:hidden;background:var(--ink2);cursor:zoom-in;border:1px solid transparent}
.s-jour .tuile:hover{border-color:var(--gold)}
.s-jour .tuile.g{grid-column:span 2;grid-row:span 2}
.s-jour .tuile.h{grid-row:span 2}
.s-jour .tuile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.s-jour .tuile img.ld{opacity:1}
.s-jour .tuile .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.s-jour .tuile .play b{width:44px;height:44px;border-radius:50%;background:rgba(10,9,8,.65);border:1px solid rgba(241,236,225,.5);display:flex;align-items:center;justify-content:center;color:var(--paper);font-size:1rem;padding-left:4px}
.s-jour .vide{color:var(--paper-dim);font-size:.85rem;padding:20px 4px}
@media (max-width:860px){
  .s-jour{flex-direction:column;overflow-y:auto;justify-content:flex-start;padding-top:10px}
  .s-jour .recit{flex:none;max-width:none;padding:16px 4px 6px}
  .s-jour .rtext{overflow:visible}
  .s-jour .recit .astuce{margin-top:0;padding-top:4px}
  .s-jour .mur{flex:none;overflow:visible;width:100%}
  .s-jour .grille{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));grid-auto-rows:96px}
}

/* ---------- lightbox ---------- */
#light{position:fixed;inset:0;background:rgba(8,7,6,.97);z-index:150;display:none;align-items:center;justify-content:center}
#light.open{display:flex}
#light .media{max-width:94vw;max-height:86vh;display:flex;align-items:center;justify-content:center}
#light img{max-width:94vw;max-height:86vh;object-fit:contain;border-radius:4px}
#light .frame{width:min(1100px,94vw);aspect-ratio:16/10;max-height:82vh;background:#000;border-radius:8px;overflow:hidden}
#light iframe{width:100%;height:100%;border:none}
#light .cap{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--paper-dim);font-size:.78rem;letter-spacing:.1em}
#light button{position:fixed;background:rgba(27,26,24,.8);border:1px solid var(--line);color:var(--paper);border-radius:50%;width:46px;height:46px;cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;z-index:155}
#light button:hover{border-color:var(--gold)}
#lclose{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
#lprev{left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
#lnext{right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}

/* ---------- chrome ---------- */
#chrome{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(10,9,8,.85));font-size:.78rem;color:var(--paper-dim)}
#chrome .where{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.08em}
#chrome .num{font-variant-numeric:tabular-nums;white-space:nowrap}
#chrome button{background:none;border:1px solid var(--line);color:var(--paper-dim);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.78rem}
#chrome button:hover{color:var(--paper);border-color:var(--paper-dim)}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--verm);z-index:60;transition:width .3s;width:0}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:45;background:rgba(27,26,24,.72);border:1px solid var(--line);color:var(--paper-dim);border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:1.05rem;display:flex;align-items:center;justify-content:center}
.nav:hover{color:var(--paper);border-color:var(--gold)}
#znext{right:max(8px,env(safe-area-inset-right,0px))}
#zprev{left:max(8px,env(safe-area-inset-left,0px))}

/* ---------- mini-carte progression (en bas du récit) ---------- */
#mini{display:none;width:100%;background:rgba(27,26,24,.6);border:1px solid var(--line);border-radius:10px;padding:6px 6px 4px;margin-top:10px;flex:none}
#mini.on{display:block}
#mini svg{display:block;width:100%;height:auto;max-height:30vh}
#mini .lbl{text-align:center;color:var(--paper-dim);font-size:.64rem;letter-spacing:.08em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .lbl b{color:var(--gold);font-weight:600}
#mini .coast{fill:#1b1a18;stroke:#3a362f;stroke-width:1}
#mini .rfull{fill:none;stroke:#3f3b33;stroke-width:1.6;stroke-dasharray:3 3;stroke-linejoin:round}
#mini .rdone{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#mini .dot{fill:#4a463e}
#mini .dot.v{fill:var(--gold)}
#mini .curr{fill:var(--verm)}
@keyframes mhalo{0%{r:3.5;opacity:.75}100%{r:10;opacity:0}}
#mini .halo{fill:var(--verm);animation:mhalo 1.6s ease-out infinite}
@media (max-width:860px){#mini{margin:10px auto 0}}

/* sommaire */
#toc{position:fixed;inset:0;background:rgba(14,13,12,.96);z-index:100;display:none;overflow-y:auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 60px}
#toc.open{display:block}
#toc .in{max-width:860px;margin:0 auto}
#toc h2{font-family:var(--font-head);font-weight:500;margin:0 0 22px;display:flex;justify-content:space-between;align-items:center}
#toc h2 button{background:none;border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:6px 14px;cursor:pointer}
#toc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
#toc .item{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
#toc .item:hover{border-color:var(--gold)}
#toc .item .d{color:var(--verm);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#toc .item .t{font-family:var(--font-head);font-size:1.02rem;margin-top:3px}
#toc .item .n{color:var(--paper-dim);font-size:.75rem;margin-top:5px}
</style>
</head>
<body>

<div id="gate">
  <form id="gateForm">
    <div class="kanji">日本</div>
    <h1>Japon, mars 2026</h1>
    <p>Carnet de voyage de Jad &amp; Ramy</p>
    <input type="password" id="pw" placeholder="Mot de passe" autocomplete="off" autofocus>
    <button type="submit">Entrer</button>
    <p class="err" id="gateErr"></p>
  </form>
</div>

<div id="bar"></div>
<div id="deck"></div>
<button class="nav" id="zprev" aria-label="Précédent">←</button>
<button class="nav" id="znext" aria-label="Suivant">→</button>
<div id="chrome">
  <span class="where" id="where"></span>
  <button id="btnToc">Sommaire</button>
  <span class="num" id="num"></span>
</div>
<div id="mini"></div>

<div id="toc">
  <div class="in">
    <h2>Sommaire <button id="tocClose">Fermer ✕</button></h2>
    <div class="grid" id="tocGrid"></div>
  </div>
</div>

<div id="light">
  <div class="media" id="lmedia"></div>
  <div class="cap" id="lcap"></div>
  <button id="lclose" aria-label="Fermer">✕</button>
  <button id="lprev" aria-label="Précédent">←</button>
  <button id="lnext" aria-label="Suivant">→</button>
</div>

<script src="deck-data.js"></script>
<script>
(function(){
"use strict";
var PW="koine";
var gate=document.getElementById('gate');
try{ if(sessionStorage.getItem('jp_ok')==='1') gate.style.display='none'; }catch(e){}
document.getElementById('gateForm').addEventListener('submit',function(ev){
  ev.preventDefault();
  if(document.getElementById('pw').value.trim().toLowerCase()===PW){
    gate.style.display='none';
    try{ sessionStorage.setItem('jp_ok','1'); }catch(e){}
  } else { document.getElementById('gateErr').textContent='Mot de passe incorrect'; }
});

function thumb(id){ return 'https://lh3.googleusercontent.com/d/'+id+'=w400'; }
function big(id){ return 'https://lh3.googleusercontent.com/d/'+id+'=w1920'; }

/* ---- construire les slides ---- */
var slides=[]; // {el,label,medias?}
var deck=document.getElementById('deck');
function add(el,label,medias){ deck.appendChild(el); slides.push({el:el,label:label,medias:medias||null}); return slides.length-1; }
function div(cls){ var e=document.createElement('div'); e.className='slide '+cls; return e; }
var tocEntries=[];

/* cover */
var cv=div('s-cover');
cv.innerHTML='<div class="kanji">日本</div><h1>'+DECK.titre+'</h1><div class="dates">'+DECK.dates+'</div><p class="hint">→ flèches, espace ou glisser pour avancer · S : sommaire</p>';
add(cv,'');

/* intro */
var it=div('s-text');
it.innerHTML='<h2>Le voyage</h2><p>'+DECK.intro+'</p><div class="stats">'+DECK.stats.map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>';}).join('')+'</div>';
add(it,'Introduction');

/* carte */
var mp=div('s-map');
mp.innerHTML='<h2>L’itinéraire</h2><div class="frame" data-map="1"></div><p class="lien"><a href="'+DECK.carte+'" target="_blank" rel="noopener">Ouvrir la carte interactive en plein écran ↗</a></p>';
var MAPIDX=add(mp,'Itinéraire');
tocEntries.push({idx:1,date:'',titre:'Introduction',n:''});
tocEntries.push({idx:MAPIDX,date:'',titre:'Carte de l’itinéraire',n:''});

/* jours : une page = récit + mosaïque */
DECK.jours.forEach(function(j,ji){
  var d=div('s-jour');
  var hl=(j.highlights&&j.highlights.length)?'<div class="hl">'+j.highlights.map(function(h){return '<span>'+h+'</span>';}).join('')+'</div>':'';
  var astuce=j.medias.length?'<div class="astuce">Cliquer une photo pour l’agrandir · '+j.medias.length+' média'+(j.medias.length>1?'s':'')+'</div>':'';
  var tuiles=j.medias.map(function(m,mi){
    var cls='tuile'+(j.medias.length>4 ? (mi%7===0?' g':(mi%5===3?' h':'')) : (mi===0?' g':''));
    var play=m.v?'<span class="play"><b>▶</b></span>':'';
    return '<div class="'+cls+'" data-mi="'+mi+'"><img data-src="'+thumb(m.i)+'" alt="" loading="lazy">'+play+'</div>';
  }).join('');
  var mur=j.medias.length?'<div class="mur"><div class="grille">'+tuiles+'</div></div>':'<div class="mur"><p class="vide">Pas de photos sélectionnées pour cette journée.</p></div>';
  d.innerHTML='<div class="recit"><div class="rtext"><div class="jour">'+j.datefr+' · jour '+(ji+1)+'</div><h2>'+j.titre+'</h2><p class="resume">'+j.resume+'</p>'+hl+astuce+'</div></div>'+mur;
  var di=add(d,j.datefr+' · '+j.titre,j.medias);
  tocEntries.push({idx:di,date:j.datefr,titre:j.titre,n:j.medias.length?j.medias.length+' médias':''});
  d.addEventListener('click',function(ev){
    var t=ev.target.closest('.tuile');
    if(t) openLight(j,parseInt(t.dataset.mi,10));
  });
});

/* fin */
var fn=div('s-text');
fn.innerHTML='<h2>'+DECK.fin.titre+'</h2><p>'+DECK.fin.texte+'</p><div class="kanji" style="font-family:var(--font-head);color:var(--verm);font-size:2.4rem;margin-top:18px">ありがとう</div>';
add(fn,'Fin');

/* ---- lightbox ---- */
var light=document.getElementById('light'), lmedia=document.getElementById('lmedia'), lcap=document.getElementById('lcap');
var lJour=null, lIdx=0;
function renderLight(){
  var m=lJour.medias[lIdx];
  if(m.v){
    lmedia.innerHTML='<div class="frame"><iframe src="https://drive.google.com/file/d/'+m.i+'/preview" allow="autoplay" allowfullscreen></iframe></div>';
  } else {
    lmedia.innerHTML='<img src="'+big(m.i)+'" alt="">';
  }
  lcap.textContent=lJour.datefr+' · '+lJour.titre+' · '+(lIdx+1)+' / '+lJour.medias.length+(m.v?' · vidéo':'');
}
function openLight(j,mi){ lJour=j; lIdx=mi; renderLight(); light.classList.add('open'); }
function closeLight(){ light.classList.remove('open'); lmedia.innerHTML=''; lJour=null; }
function lightNext(){ if(lJour&&lIdx<lJour.medias.length-1){ lIdx++; renderLight(); } }
function lightPrev(){ if(lJour&&lIdx>0){ lIdx--; renderLight(); } }
document.getElementById('lclose').addEventListener('click',closeLight);
document.getElementById('lnext').addEventListener('click',lightNext);
document.getElementById('lprev').addEventListener('click',lightPrev);
light.addEventListener('click',function(ev){ if(ev.target===light) closeLight(); });

/* ---- navigation ---- */
var cur=0,N=slides.length;
function materialize(i){
  if(i<0||i>=N) return;
  slides[i].el.querySelectorAll('img[data-src]').forEach(function(im){
    im.src=im.dataset.src; im.removeAttribute('data-src');
    im.addEventListener('load',function(){ im.classList.add('ld'); });
  });
}
function mountMap(i){
  var f=slides[i].el.querySelector('[data-map]');
  if(f&&!f.querySelector('iframe')){
    f.innerHTML='<iframe src="'+DECK.carte+'" loading="lazy"></iframe>';
  }
}
function go(i){
  if(i<0) i=0; if(i>=N) i=N-1;
  if(i===cur&&slides[cur].el.classList.contains('active')) return;
  slides.forEach(function(s,k){ s.el.classList.toggle('active',k===i); });
  cur=i;
  for(var k=i-1;k<=i+1;k++) materialize(k);
  if(slides[i].el.querySelector('[data-map]')) mountMap(i);
  document.getElementById('num').textContent=(i+1)+' / '+N;
  document.getElementById('where').textContent=slides[i].label;
  document.getElementById('bar').style.width=((i)/(N-1)*100)+'%';
  var ds=MAPIDX+1, ji=i-ds;
  if(ji>=0&&ji<DECK.jours.length){
    updateMini(ji,false); mini.classList.add('on');
    var rc=slides[i].el.querySelector('.recit');
    if(rc&&mini.parentNode!==rc) rc.appendChild(mini);
  } else if(i===N-1){
    updateMini(DECK.jours.length-1,true); mini.classList.add('on');
    if(mini.parentNode!==slides[i].el) slides[i].el.appendChild(mini);
  } else { mini.classList.remove('on'); }
  try{ localStorage.setItem('jp_pos2',String(i)); }catch(e){}
}
function next(){ go(cur+1); } function prevS(){ go(cur-1); }
document.getElementById('znext').addEventListener('click',next);
document.getElementById('zprev').addEventListener('click',prevS);
document.addEventListener('keydown',function(ev){
  if(gate.style.display!=='none'&&getComputedStyle(gate).display!=='none') return;
  if(light.classList.contains('open')){
    if(ev.key==='Escape') closeLight();
    else if(ev.key==='ArrowRight'){ ev.preventDefault(); lightNext(); }
    else if(ev.key==='ArrowLeft'){ ev.preventDefault(); lightPrev(); }
    return;
  }
  if(document.getElementById('toc').classList.contains('open')){
    if(ev.key==='Escape') toggleToc(false);
    return;
  }
  if(ev.key==='ArrowRight'||ev.key===' '||ev.key==='PageDown'){ ev.preventDefault(); next(); }
  else if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ ev.preventDefault(); prevS(); }
  else if(ev.key==='Home'){ go(0); }
  else if(ev.key==='End'){ go(N-1); }
  else if(ev.key.toLowerCase()==='s'){ toggleToc(); }
});
var tx=null,ty=null;
document.addEventListener('touchstart',function(ev){ if(ev.touches.length===1){ tx=ev.touches[0].clientX; ty=ev.touches[0].clientY; } },{passive:true});
document.addEventListener('touchend',function(ev){
  if(tx===null) return;
  var dx=ev.changedTouches[0].clientX-tx, dy=ev.changedTouches[0].clientY-ty;
  tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
    if(light.classList.contains('open')){ if(dx<0) lightNext(); else lightPrev(); }
    else { if(dx<0) next(); else prevS(); }
  }
},{passive:true});

/* ---- sommaire ---- */
var toc=document.getElementById('toc');
function toggleToc(force){
  var open=(typeof force==='boolean')?force:!toc.classList.contains('open');
  toc.classList.toggle('open',open);
}
document.getElementById('btnToc').addEventListener('click',function(){toggleToc();});
document.getElementById('tocClose').addEventListener('click',function(){toggleToc(false);});
var tg=document.getElementById('tocGrid');
tocEntries.forEach(function(t){
  var e=document.createElement('div'); e.className='item';
  e.innerHTML='<div class="d">'+(t.date||'•')+'</div><div class="t">'+t.titre+'</div><div class="n">'+t.n+'</div>';
  e.addEventListener('click',function(){ toggleToc(false); go(t.idx); });
  tg.appendChild(e);
});

var mini=document.getElementById('mini');
(function buildMini(){
  var fullPts=ROUTE.map(function(r){return CITY[r[0]][0]+','+CITY[r[0]][1];}).join(' ');
  var dots=Object.keys(CITY).map(function(c){
    return '<circle class="dot" id="md-'+c+'" cx="'+CITY[c][0]+'" cy="'+CITY[c][1]+'" r="2.2"/>';
  }).join('');
  mini.innerHTML='<svg viewBox="0 0 200 227.5" aria-hidden="true">'
    +'<path class="coast" d="'+JP+'"/>'
    +'<polyline class="rfull" points="'+fullPts+'"/>'
    +'<polyline class="rdone" id="mprog" points=""/>'
    +dots
    +'<circle class="halo" id="mhalo" cx="0" cy="0" r="3.5" style="display:none"/>'
    +'<circle class="curr" id="mcurr" cx="0" cy="0" r="3" style="display:none"/>'
    +'</svg><div class="lbl" id="mlbl"></div>';
})();
function updateMini(ji,final){
  var pts=ROUTE.filter(function(r){return r[1]<=ji;}).map(function(r){return CITY[r[0]][0]+','+CITY[r[0]][1];}).join(' ');
  document.getElementById('mprog').setAttribute('points',pts);
  Object.keys(CITY).forEach(function(c){
    document.getElementById('md-'+c).classList.toggle('v',FIRSTDAY[c]<=ji);
  });
  var curr=document.getElementById('mcurr'), halo=document.getElementById('mhalo');
  if(final){
    curr.style.display='none'; halo.style.display='none';
    document.getElementById('mlbl').innerHTML='<b>Itinéraire complet</b> · 26 jours';
  } else {
    var c=CITY[DAYCITY[ji]];
    curr.style.display=''; halo.style.display='';
    curr.setAttribute('cx',c[0]); curr.setAttribute('cy',c[1]);
    halo.setAttribute('cx',c[0]); halo.setAttribute('cy',c[1]);
    document.getElementById('mlbl').innerHTML='Jour '+(ji+1)+'/25 · <b>'+DAYCITY[ji]+'</b>';
  }
}
